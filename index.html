<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dar Serghini | دار السرغيني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fff;--ink:#1c2a5e;--muted:#6b6f80;--gold:#c4a25a;--teal:#2a97a3;--wine:#7a1f3a;--green:#1f5c45;--line:#e8dfcc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:18px}
html[lang=ar] body{font-family:'Cairo',Tahoma,sans-serif;font-size:16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg);}
header::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:6px;background:repeating-linear-gradient(90deg,var(--wine) 0 24px,var(--gold) 24px 32px,var(--teal) 32px 56px,var(--gold) 56px 64px,var(--green) 64px 88px,var(--gold) 88px 96px)}
.lg{border-radius:50%;display:block}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--gold);letter-spacing:.5px}
.bar{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.pill{border:1px solid var(--gold);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:600}
.pill.fill{background:var(--wine);border-color:var(--wine);color:#fff}
.hero{text-align:center;padding:36px 20px 28px;margin-top:6px;background:var(--card);color:var(--ink);border-bottom:3px double var(--gold)}
.hero h1{margin:8px 0;font-size:34px;color:var(--gold)}
.hero p{margin:0 auto 18px;max-width:420px;opacity:.9}
.hero .pill{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:22px 16px 90px}
h2{color:var(--gold);text-align:center;margin:0 0 16px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card svg{width:100%;height:130px;display:block}
.card .b{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{margin:0;font-size:21px}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:700;color:var(--wine)}
.add{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:600}
#cartBtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-end:16px;z-index:6;box-shadow:0 4px 14px #0004}
#drawer{position:fixed;inset:0;z-index:9;background:#0007;display:none}
#drawer.open{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;max-height:85%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--ink)}
input{width:100%;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.wa{width:100%;background:#25a244;color:#fff;border:0;border-radius:10px;padding:12px;font-weight:700;font-size:17px}
footer{text-align:center;padding:24px;color:var(--muted);font-size:15px}
</style>
</head>
